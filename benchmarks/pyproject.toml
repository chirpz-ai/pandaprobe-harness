# =============================================================================
# PandaBench — the benchmark A/B study suite for the PandaProbe Harness.
#
# This is a SELF-CONTAINED uv project, deliberately NOT a workspace member of
# the parent `pandaprobe-harness` repo. It depends on the RELEASED harness
# package from PyPI — never a path/editable dependency on ../src — so the study
# measures the shipped artifact.
# =============================================================================
[project]
name = "pandabench"
version = "0.1.0"
description = "A/B benchmark study measuring the PandaProbe Harness on agent reliability."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    # The harness, exact-pinned so the study measures one fixed artifact.
    "pandaprobe-harness==0.7.0",
    # The PandaProbe SDK: session binding + the native LiteLLM wrapper (>=0.5)
    # that auto-traces every litellm call so sessions are scoreable.
    "pandaprobe>=0.5",
    # The single LLM provider layer for the entire study. The [google] extra
    # pulls google-auth so LiteLLM can use Vertex AI via ADC (Vertex is primary).
    "litellm[google]>=1.55",
    # HTTP client for driving the isolated AppWorld environment server.
    "httpx>=0.27",
    # Terminal-Bench's stable orchestration surface. This must live in the same
    # environment as pandabench so Harbor can import our custom agent.
    "harbor==0.18.0",
    # Analysis + reporting.
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "tabulate>=0.9", # markdown tables in report.md
    # Config + env loading.
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# tau2-bench is not on PyPI under a verified name, so it is pinned to a tag.
# It coexists with the core deps (its only constraint is litellm>=1.65.0, no
# upper bound), so unlike AppWorld it lives in THIS venv:
#   uv sync --extra tau2
# Its data tree is not packaged — clone the repo and point TAU2_DATA_DIR at
# <clone>/data, which tau2 reads at import time. See IMPLEMENTATION_NOTES.md.
tau2 = ["tau2 @ git+https://github.com/sierra-research/tau2-bench.git@v0.2.0"]

# NOTE — AppWorld is the one harness that is NOT an in-process dependency:
# it pins pydantic<2, which is irreconcilable with modern LiteLLM
# (pydantic>=2.10). It therefore runs as an ISOLATED service in its own venv
# (see scripts/appworld_env, installed by `make setup`) and pandabench drives it
# over its HTTP API — pandabench never imports it. harbor and tau2 are ordinary
# dependencies of this project: harbor because its CLI must run from an
# interpreter that can import `pandabench.adapters.harbor_agent`, tau2 via the
# extra above. See IMPLEMENTATION_NOTES.md.

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
]

[project.scripts]
pandabench-run = "pandabench.cli:run_main"
pandabench-report = "pandabench.cli:report_main"
pandabench-calibrate = "pandabench.cli:calibrate_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pandabench"]

# The `tau2` extra is a git reference (tau2 is not on PyPI under a verified name).
[tool.hatch.metadata]
allow-direct-references = true

# -- Tooling: independent of the parent repo's config -------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# ASYNC109: `timeout` params mirror the harness CliClient protocol (the fake CLI
# in tests must match its signature); same rationale as the harness package.
ignore = ["ASYNC109"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "scripts"]
mypy_path = "src"

# Third-party benchmark/provider libs ship partial or no type stubs.
[[tool.mypy.overrides]]
module = ["tau2.*", "appworld.*", "harbor.*", "litellm.*", "pandaprobe.*", "scipy.*"]
ignore_missing_imports = true
