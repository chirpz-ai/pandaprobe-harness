# =============================================================================
# Model registry — the single place the study's provider-routing constraints
# live. Keys are study model identifiers; values resolve to LiteLLM strings.
#
# ROUTING CONSTRAINTS (see IMPLEMENTATION_NOTES.md):
#   * Vertex AI serves Gemini — ADC auth.
#   * OpenAI models go through OpenAI's own API (Vertex does not serve them).
#   * Claude models default to AWS Bedrock, with Anthropic API as a fallback.
#     They are switchable per run via `--backend`,
#     `CLAUDE_BACKEND`, or the per-model `default_backend` below.
#   * Open-weight models use AWS Bedrock as a single backend. `--backend` is not
#     applicable to them; gpt-oss is not served by OpenAI's first-party API.
#
# `param_allowlist` gates which sampler params LiteLLM may forward. The study
# intentionally fixes Claude and the Bedrock open-weight models to max_tokens
# only; GPT-5.x also omits unsupported sampler params, while Gemini accepts
# them. LiteLLM 1.91.1 reports no temperature-support metadata for these nine
# open-weight models, so max_tokens is the conservative shared policy. The
# client normally budgets 4,096 output tokens; `default_max_tokens` raises that
# task/replay fallback for models whose internal reasoning exhausted it before
# a tool call. An explicit per-call budget still wins. No open-weight model
# requires a `default_params` constant for task tool calling.
#
# `repair_overrides` contains model-compatibility settings for managed repair
# when the task model is reused as the repair model. It does not apply if the
# study selects a dedicated repair model. A null reasoning_effort deliberately
# omits the global study value; larger max_turns accommodates models that need
# more protocol steps, without changing the task agent's turn budget.
# `terminal_overrides` bounds only the provider message history for open weights.
# Terminal command execution and stdout/stderr remain unchanged. Existing closed
# models omit it and retain their established Terminal-Bench behavior.
# `price_per_mtok` is a fallback used when litellm.completion_cost has no price.
#
# Some Bedrock models require inference profiles rather than bare foundation
# model IDs. Claude uses global profiles because its bare IDs reject on-demand
# invocation; Llama 4 Scout similarly requires the `us.` cross-region profile.
# Verify model availability and pricing at run time.
# Claude rates are from:
# https://platform.claude.com/docs/en/about-claude/pricing
# =============================================================================
models:

  gemini-3.1-flash-lite:
    provider_family: gemini
    litellm_model: "vertex_ai/gemini-3.1-flash-lite"
    param_allowlist: [temperature, top_p, max_tokens]
    price_per_mtok: {input: 0.25, output: 1.50}

  gemini-3.5-flash:
    provider_family: gemini
    litellm_model: "vertex_ai/gemini-3.5-flash"
    param_allowlist: [temperature, top_p, max_tokens]
    price_per_mtok: {input: 1.50, output: 9.0}

  gemini-3.1-pro:
    provider_family: gemini
    litellm_model: "vertex_ai/gemini-3.1-pro-preview"
    param_allowlist: [temperature, top_p, max_tokens]
    price_per_mtok: {input: 2.00, output: 12.0}

  gpt-5.6-luna:
    provider_family: openai
    litellm_model: "openai/gpt-5.6-luna"
    param_allowlist: [max_tokens]
    default_params: {reasoning_effort: none}
    price_per_mtok: {input: 1.00, output: 6.00}

  gpt-5.6-terra:
    provider_family: openai
    litellm_model: "openai/gpt-5.6-terra"
    param_allowlist: [max_tokens]
    default_params: {reasoning_effort: none}
    price_per_mtok: {input: 2.50, output: 15.00}

  gpt-5.6-sol:
    provider_family: openai
    litellm_model: "openai/gpt-5.6-sol"
    param_allowlist: [max_tokens]
    default_params: {reasoning_effort: none}
    price_per_mtok: {input: 5.00, output: 30.00}

  # Open-weight Bedrock models. All nine use LiteLLM's Bedrock Converse path
  # and have been verified to return native structured tool calls.
  gpt-oss-120b:
    provider_family: gpt-oss
    litellm_model: "bedrock/openai.gpt-oss-120b-1:0"
    param_allowlist: [max_tokens]
    # Bedrock Harmony rejects the study's reasoning_effort="none".
    repair_overrides: {reasoning_effort: null, max_turns: 12}
    terminal_overrides: &terminal_128k {max_input_chars: 120000}
    price_per_mtok: {input: 0.15, output: 0.60}

  gpt-oss-20b:
    provider_family: gpt-oss
    litellm_model: "bedrock/openai.gpt-oss-20b-1:0"
    param_allowlist: [max_tokens]
    default_max_tokens: 8192
    # Bedrock Harmony rejects the study's reasoning_effort="none".
    repair_overrides: {reasoning_effort: null, max_turns: 12}
    terminal_overrides: *terminal_128k
    price_per_mtok: {input: 0.07, output: 0.30}

  qwen3-32b:
    provider_family: qwen
    litellm_model: "bedrock/qwen.qwen3-32b-v1:0"
    param_allowlist: [max_tokens]  # 16k output ceiling; client defaults to 4,096
    terminal_overrides: *terminal_128k
    price_per_mtok: {input: 0.15, output: 0.60}

  qwen3-coder-30b-a3b:
    provider_family: qwen
    litellm_model: "bedrock/qwen.qwen3-coder-30b-a3b-v1:0"
    param_allowlist: [max_tokens]
    repair_overrides: {max_turns: 12}
    terminal_overrides: &terminal_256k {max_input_chars: 240000}
    price_per_mtok: {input: 0.15, output: 0.60}

  qwen3-235b-a22b-2507:
    provider_family: qwen
    litellm_model: "bedrock/qwen.qwen3-235b-a22b-2507-v1:0"
    param_allowlist: [max_tokens]
    terminal_overrides: *terminal_256k
    price_per_mtok: {input: 0.22, output: 0.88}

  qwen3-next-80b-a3b:
    provider_family: qwen
    litellm_model: "bedrock/qwen.qwen3-next-80b-a3b"
    param_allowlist: [max_tokens]
    default_max_tokens: 8192  # its 8k ceiling; 4,096 ended before a tool call
    terminal_overrides: *terminal_128k
    price_per_mtok: {input: 0.15, output: 1.20}

  nemotron-3-super-120b:
    provider_family: nemotron
    litellm_model: "bedrock/nvidia.nemotron-super-3-120b"
    param_allowlist: [max_tokens]
    repair_overrides: {max_turns: 12}
    terminal_overrides: *terminal_256k
    price_per_mtok: {input: 0.15, output: 0.65}

  kimi-k2.5:
    provider_family: kimi
    litellm_model: "bedrock/moonshotai.kimi-k2.5"
    param_allowlist: [max_tokens]
    terminal_overrides: *terminal_256k
    price_per_mtok: {input: 0.60, output: 3.00}

  llama-4-scout-17b:
    provider_family: llama
    # Bedrock exposes Scout through an inference profile only. The bare
    # meta.llama4-* ID rejects on-demand invocation; the `us.` prefix is required.
    litellm_model: "bedrock/us.meta.llama4-scout-17b-instruct-v1:0"
    param_allowlist: [max_tokens]  # 4k output ceiling = client's 4,096 default
    terminal_overrides: *terminal_128k
    price_per_mtok: {input: 0.17, output: 0.66}

  claude-opus-5:
    provider_family: claude
    backends:
      bedrock: "bedrock/global.anthropic.claude-opus-5"
      anthropic: "anthropic/claude-opus-5"
    default_backend: bedrock
    param_allowlist: [max_tokens]
    price_per_mtok: {input: 5.0, output: 25.0}

  claude-sonnet-5:
    provider_family: claude
    backends:
      bedrock: "bedrock/global.anthropic.claude-sonnet-5"
      anthropic: "anthropic/claude-sonnet-5"
    default_backend: bedrock
    param_allowlist: [max_tokens]
    price_per_mtok: {input: 3.0, output: 15.0}

  claude-haiku-4-5:
    provider_family: claude
    backends:
      bedrock: "bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0"
      anthropic: "anthropic/claude-haiku-4-5-20251001"
    default_backend: bedrock
    param_allowlist: [max_tokens]
    price_per_mtok: {input: 1.0, output: 5.0}

  # Dry-run pseudo-model: no real API calls (the MockClient is used instead).
  mock:
    provider_family: mock
    litellm_model: "mock/mock"
    mock: true
    param_allowlist: [max_tokens]

# Named roles used by the runners.
roles:
  user_simulator: gemini-3.1-flash-lite   # tau2 user simulator: cheap, fixed across arms
  dry_run: mock
  smoke: gemini-3.1-flash-lite             # the cheap model used by `make smoke`
