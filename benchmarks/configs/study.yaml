# =============================================================================
# Study design — arms, seeds, trials, datasets, thresholds, harness knobs.
# See IMPLEMENTATION_NOTES.md. Nothing study-relevant is hardcoded.
#
# The harness arm is LIVE for a benchmark's whole dataset: one continuous pass,
# no learning/eval split, no frozen ruleset. Task order is a pure function of
# (dataset, seed) and identical in both arms — and it is load-bearing, since it
# decides what has been learned by the time task N runs.
# =============================================================================
arms: [baseline, harness]     # managed repair always uses the candidate-validation lifecycle
seeds: [1, 2, 3]              # >=3 seeds; each shuffles task order (counterbalances what
                              #   the harness sees early, now that order matters)
k: 4                          # trials per task (pass@1 = first trial; pass^k = all k)

# Harness knobs for the study (override the package defaults). Lowered
# rule_trial_min_sessions so rules can be promoted within a single run
# (Checkpoint 2). Recorded here so every run is reproducible.
harness:
  rule_trial_min_sessions: 3
  rule_promote_margin: 0.05
  rule_regress_margin: 0.05
  replay_timeout_s: 180
  replay_max_turns: 15
  # AppWorld holds ONE world behind a lock shared by live trials and background
  # replays, so a replay can queue for minutes. This grace covers reaching the
  # starting line; replay_timeout_s then bounds the run. Without the split, the
  # wait consumes the run budget and the replay is recorded as inconclusive
  # evidence about a candidate that never executed.
  replay_env_wait_timeout_s: 900
  # Replay work allowed in one validation round. Past it, remaining candidates
  # still get a verdict — the cheap forward-trial one — instead of waiting for a
  # sequential replay slot. Candidates accrue faster than replays decide them.
  validation_round_budget_s: 600
  regression_sample: 0        # 0 = replay the whole eval-set
  # Background eval poll budget = poll_interval_s * poll_max_attempts. AppWorld/tau2
  # trace evals are LLM-judged and can take 6-12 min, so keep this
  # above that or scores/notices never land.
  poll_interval_s: 5          # seconds between score polls
  poll_max_attempts: 200      # -> ~1000s (17 min) background poll budget
  # Settle barrier, run ONCE at the end of a run (before archiving): wait for
  # outstanding turn evals + candidate-rule validation to drain, so a candidate
  # that has earned a verdict receives one instead of being archived as
  # permanently provisional. Bounded; breaks early when drained. Validation is not
  # deferred to here — the harness spawns it from every handled report during the
  # run, which is what lets a rule be promoted mid-run.
  settle_timeout_s: 1080      # max seconds to wait for evals + validation to drain
  settle_poll_s: 10           # seconds between drain checks
  gate_window: 10             # ten non-improving evaluated trace updates before Tier-1 STALL
  enable_tier3: false         # opt-in: each judge metric re-reads the whole trace
  # The per-turn evaluation + managed-repair barrier. Must exceed one turn's eval latency
  # poll budget above) or the agent outruns its own diagnosis, which is exactly
  # what made v1's healing after-the-fact.
  barrier_timeout_s: 1080
  outcome_threshold: 0.9      # AppWorld pass-ratio floor for the outcome verifier
  # Managed repair is owned by pandaprobe-harness. Null explicitly reuses each
  # run's resolved task-model identifier. Current OpenAI reasoning models require
  # reasoning_effort=none for function tools on the SDK's chat-completions path.
  repair_model: null
  repair_reasoning_effort: "none"
  repair_timeout_s: 60
  repair_max_turns: 6          # supports providers that emit one repair tool per round
  repair_max_tokens: 4096
  repair_temperature: null
  trace_repair_agent: true

# Absolute breach thresholds per benchmark. Same value for ALL arms/seeds of a
# benchmark. These are the pre-calibration defaults; Checkpoint 1 tunes them per
# benchmark from the metric<->failure calibration and records the chosen value here.
breach_thresholds:
  default: 0.5
  appworld: 0.5
  terminal_bench: 0.5
  tau2: 0.5

# Per-benchmark task universe. Each dataset is run WHOLE — nothing here
# subdivides it. Task-specific detail (dataset, tool surface) is merged from
# configs/benchmarks/<name>.yaml; keys here win.
benchmarks:
  appworld:
    dataset: dev              # 57 tasks, run whole; --dataset test_normal (168) for more power
    max_turns: 100            # a turn = one execute(); AppWorld's env cap is 1000
  terminal_bench:
    dataset: terminal-bench-sample@2.0  # smaller default; use terminal-bench@2.0 for full
    max_turns: 100            # Terminal-Bench has no native turn cap (timeout-driven);
                              #   100 is our in-process agent budget
  tau2:
    dataset: airline          # default; valid domains: airline, retail, telecom
    max_turns: 100            # matches tau2's native default (run_tasks max_steps=100)

# Budget discipline: `make matrix` prints an estimate and asks before launching.
cost_cap_usd: 200

# The smoke test: cheap, fast, exercises the whole pipeline end to end.
smoke:
  model: gemini-3.1-flash-lite
  tasks: 2                    # tasks per run (--limit), not per phase
  k: 1
  arms: [baseline, harness]
  benchmarks: [appworld, terminal_bench, tau2]
